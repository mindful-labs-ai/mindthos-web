map $request_uri $mindthos_request_path {
  ~^(?<mindthos_shared_document_path>/(?:v1/)?shared-documents/[^/?]+/[^/?]+)/[^/?]+(?<mindthos_shared_document_suffix>/[^?]*)? $mindthos_shared_document_path/[REDACTED]$mindthos_shared_document_suffix;
  ~^([^?]*) $1;
}

log_format mindthos_json escape=json
  '{"timestamp":"$time_iso8601",'
  '"method":"$request_method",'
  '"path":"$mindthos_request_path",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"host":"$host",'
  '"cf_ray":"$http_cf_ray",'
  '"user_agent":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # nginx error log embeds the raw request target and cannot apply the access
  # log token redaction map. Keep request failures in the structured access log
  # and emit only critical process-level failures to stderr.
  error_log /dev/stderr crit;
  access_log /dev/stdout mindthos_json;

  add_header Strict-Transport-Security "max-age=63072000" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files /index.html =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files $uri @previous_asset;
  }

  location @previous_asset {
    internal;
    rewrite ^/assets/(.*)$ /$1 break;
    root /usr/share/nginx/previous-assets;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files $uri @asset_not_found;
  }

  location @asset_not_found {
    internal;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 404;
  }

  # Browser server API calls stay on the web origin. The image accepts only the
  # Service Connect server alias. Keep the request limit aligned with the
  # NestJS 3mb body parser: shared-document signatures can legitimately exceed
  # nginx's 1m default.
  location ~ ^/v1(?:/|$) {
    client_max_body_size 3m;
    proxy_pass ${MINDTHOS_API_PROXY_TARGET};
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
  }

  location = /api/session/create {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "OPTIONS, POST" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    return 410 '{"status":"failed","message":"This legacy endpoint has been retired. Use /v1/sessions."}';
  }

  location = /api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 404 '{"status":"failed","message":"API route not found."}';
  }

  location ^~ /api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 404 '{"status":"failed","message":"API route not found."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
