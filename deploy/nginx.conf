map $request_uri $mindthos_request_path {
  ~^([^?]*) $1;
}

log_format mindthos_json escape=json
  '{"timestamp":"$time_iso8601",'
  '"method":"$request_method",'
  '"path":"$mindthos_request_path",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"host":"$host",'
  '"cf_ray":"$http_cf_ray",'
  '"user_agent":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout mindthos_json;

  add_header Strict-Transport-Security "max-age=63072000" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files /index.html =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files $uri @previous_asset;
  }

  location @previous_asset {
    internal;
    rewrite ^/assets/(.*)$ /$1 break;
    root /usr/share/nginx/previous-assets;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000" always;
    try_files $uri @asset_not_found;
  }

  location @asset_not_found {
    internal;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 404;
  }

  # Browser server API calls stay on the web origin. ECS staging overrides the
  # target with Service Connect (http://server:3000); the image default keeps a
  # production deployment backward-compatible with the public gateway.
  location ~ ^/v1(?:/|$) {
    proxy_pass ${MINDTHOS_API_PROXY_TARGET};
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
  }

  location = /api/session/create {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "OPTIONS, POST" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    return 410 '{"status":"failed","message":"This legacy endpoint has been retired. Use https://gateway.mindthos.com/v1/sessions."}';
  }

  location = /api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 404 '{"status":"failed","message":"API route not found."}';
  }

  location ^~ /api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 404 '{"status":"failed","message":"API route not found."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
